name: Release GeoServer extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension-zip:
    name: Build extension zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout geoserver-portolan
        uses: actions/checkout@v4
        with:
          path: geoserver-portolan
          fetch-depth: 0

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: geoserver-portolan
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Checkout portolan-java
        uses: actions/checkout@v4
        with:
          repository: jemacchi/portolan-java
          path: portolan-java

      - name: Checkout GeoServer integration branch
        uses: actions/checkout@v4
        with:
          repository: jemacchi/geoserver
          ref: geoserver-portolan
          path: geoserver
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install portolan-java
        run: mvn -B -f portolan-java/pom.xml install

      - name: Overlay module source
        run: |
          rm -rf geoserver/src/community/portolan
          mkdir -p geoserver/src/community/portolan
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            geoserver-portolan/ geoserver/src/community/portolan/

      - name: Test module
        run: mvn -B -f geoserver/src/community/pom.xml -Pportolan -pl portolan test

      - name: Package slim extension zip
        run: mvn -B -f geoserver/src/community/pom.xml -Pportolan -pl portolan package -DskipTests

      - name: Package required store extensions
        run: >-
          mvn -B -f geoserver/src/community/pom.xml
          -Passembly,geoparquet,cog,pmtiles-store
          -pl geoparquet,cog/cog-http,pmtiles-store
          -am install -DskipTests

      - name: Assemble and validate release bundles
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t portolan_zips < <(find geoserver/src/community/portolan/target \
            -type f -name 'geoserver-portolan-*-extension.zip')
          if [[ ${#portolan_zips[@]} -ne 1 ]]; then
            echo "Expected one Portolan archive, found ${#portolan_zips[@]}" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="dev-${GITHUB_SHA::7}"
          fi
          mapfile -t store_zips < <(find geoserver/src/community/target/release -type f \
            \( -name '*-geoparquet-plugin.zip' \
              -o -name '*-cog-http-plugin.zip' \
              -o -name '*-pmtiles-store-plugin.zip' \))
          if [[ ${#store_zips[@]} -ne 3 ]]; then
            echo "Expected three store extension archives, found ${#store_zips[@]}" >&2
            printf '%s\n' "${store_zips[@]}" >&2
            exit 1
          fi

          geoserver-portolan/scripts/assemble-release-bundles.sh \
            "$release_version" "${portolan_zips[0]}" dist "${store_zips[@]}"
          ls -lh dist/*.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoserver-portolan-extensions
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
