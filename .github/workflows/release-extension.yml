name: Release GeoServer extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extension-zip:
    name: Build extension zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout geoserver-portolan
        uses: actions/checkout@v4
        with:
          path: geoserver-portolan
          fetch-depth: 0

      - name: Verify tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: geoserver-portolan
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Checkout portolan-java
        uses: actions/checkout@v4
        with:
          repository: jemacchi/portolan-java
          path: portolan-java

      - name: Checkout GeoServer integration branch
        uses: actions/checkout@v4
        with:
          repository: jemacchi/geoserver
          ref: geoserver-portolan
          path: geoserver
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Install portolan-java
        run: mvn -B -f portolan-java/pom.xml install

      - name: Overlay module source
        run: |
          rm -rf geoserver/src/community/portolan
          mkdir -p geoserver/src/community/portolan
          rsync -a --delete \
            --exclude .git \
            --exclude target \
            geoserver-portolan/ geoserver/src/community/portolan/

      - name: Test module
        run: mvn -B -f geoserver/src/community/pom.xml -Pportolan -pl portolan test

      - name: Package extension zip
        run: mvn -B -f geoserver/src/community/pom.xml -Pportolan -pl portolan package -DskipTests

      - name: Collect artifact
        run: |
          mkdir -p dist
          find geoserver/src/community/portolan/target \
            -name 'geoserver-portolan-*-extension.zip' \
            -exec cp {} dist/ \;
          unzip -l dist/geoserver-portolan-*-extension.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: geoserver-portolan-extension
          path: dist/*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
